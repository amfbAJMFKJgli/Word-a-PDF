<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor Word ↔ PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 520px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #1a1a2e;
            margin-bottom: 0.5rem;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.5;
        }

        .conversion-options {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .conversion-options input { display: none; }

        .conversion-options label {
            flex: 1;
            padding: 1rem 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
        }

        .conversion-options label:hover {
            border-color: #667eea;
            color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .conversion-options input:checked + label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: #fafbff;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.15);
        }

        .upload-area input { display: none; }

        .upload-area label {
            cursor: pointer;
            color: #667eea;
            font-weight: 600;
            font-size: 1.05rem;
            display: block;
        }

        .file-name {
            margin-top: 0.75rem;
            color: #333;
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-all;
        }

        .btn-convert {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.05rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            letter-spacing: 0.3px;
        }

        .btn-convert:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
        }

        .btn-convert:active {
            transform: translateY(-1px);
        }

        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .flash {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .flash.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .flash.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 1.5rem;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.5rem;
            }

            p.subtitle {
                font-size: 0.9rem;
            }

            .conversion-options {
                flex-direction: column;
            }

            .conversion-options label {
                padding: 0.85rem;
            }

            .upload-area {
                padding: 1.5rem 1rem;
            }

            .icon {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 1.25rem;
            }

            h1 {
                font-size: 1.3rem;
            }

            .btn-convert {
                padding: 0.85rem 1.5rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔄</div>
        <h1>Conversor Word ↔ PDF</h1>
        <p class="subtitle">Convierte archivos en ambas direcciones, preservando formato, tablas e imágenes</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data" id="uploadForm">
            <div class="conversion-options">
                <input type="radio" name="conversion_type" id="wordToPdf" value="word_to_pdf" checked onchange="updateAccept()">
                <label for="wordToPdf">📄 Word → PDF</label>
                <input type="radio" name="conversion_type" id="pdfToWord" value="pdf_to_word" onchange="updateAccept()">
                <label for="pdfToWord">📋 PDF → Word</label>
            </div>

            <div class="upload-area" onclick="document.getElementById('file').click()">
                <input type="file" name="file" id="file" accept=".docx" onchange="updateFileName(this)">
                <label>📁 Haz clic para seleccionar archivo</label>
                <div class="file-name" id="fileName"></div>
            </div>
            <button type="submit" class="btn-convert" id="btnConvert">Convertir</button>
        </form>
    </div>

    <script>
        function updateFileName(input) {
            const nameDiv = document.getElementById('fileName');
            if (input.files.length > 0) {
                nameDiv.textContent = '📄 ' + input.files[0].name;
            } else {
                nameDiv.textContent = '';
            }
        }

        function updateAccept() {
            const wordToPdf = document.getElementById('wordToPdf').checked;
            document.getElementById('file').accept = wordToPdf ? '.docx' : '.pdf';
        }
    </script>
</body>
</html>
